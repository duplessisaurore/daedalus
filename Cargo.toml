[workspace]
members = [
    "crates/*"
]

resolver = "3"

[workspace.dependencies]
hashbrown = "0.17.1"
cfg-if = "1.0"
linked_list_allocator = "0.10"
lepton3 = { version = "10.0.3", git = "https://github.com/duplessisaurore/lepton3" }
daedalus_program = { path = "./crates/daedalus_program" }
daedalus_caps = { path = "./crates/daedalus_caps" }

[profile.release]
# Try optimise harder for even better performance..
codegen-units = 1
lto = true