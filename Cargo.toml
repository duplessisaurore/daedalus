[workspace]
members = [
    "crates/*"
]

resolver = "3"

[workspace.dependencies]
hashbrown = "0.17.1"
cfg-if = "1.0"
linked_list_allocator = "0.10"
lepton3 = { version = "10", git = "https://github.com/duplessisaurore/lepton3" }
daedalus_program = { path = "./crates/daedalus_program" }
daedalus_caps = { path = "./crates/daedalus_caps" }
daedalus_wasm = { path = "./crates/daedalus_wasm" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
